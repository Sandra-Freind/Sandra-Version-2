name: Sandra V2 run scope hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scope hardening
        run: python scripts/harden_sandra_scope.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/api-server/src/lib/sandraKnowledge.ts artifacts/api-server/src/lib/sandraMasterTaxonomy.ts artifacts/api-server/src/routes/sandra.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sandra V2: harden forbidden scope and taxonomy matching"
          git push
