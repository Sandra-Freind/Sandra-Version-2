name: Sandra V2 run conversation persistence hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply conversation persistence hardening
        run: python scripts/harden_conversation_state_persistence.py
      - name: Build API server
        working-directory: artifacts/api-server
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify persisted session survives process restart
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sandra-session-persistence-test
          export SANDRA_SESSION_STATE_DIR=/tmp/sandra-session-persistence-test
          node --input-type=module <<'NODE'
          const mod = await import('./dist/lib/conversationState.js');
          const s='v3-persist-test-session';
          const a=mod.updateConversationState(s,'Ich bin in Naklua');
          if (mod.resolveRelevantRegion(a)!=='naklua') throw new Error('first process did not store Naklua');
          console.log('PROCESS1_REGION_OK');
          NODE
          node --input-type=module <<'NODE'
          const mod = await import('./dist/lib/conversationState.js');
          const s='v3-persist-test-session';
          const a=mod.updateConversationState(s,'Ich suche eine Apotheke');
          if (mod.resolveRelevantRegion(a)!=='naklua') throw new Error('restart lost Naklua');
          if (a.waitingFor==='location') throw new Error('restart asked for location again');
          console.log('PROCESS2_PERSISTED_REGION_OK');
          NODE
      - name: Commit hardened state logic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/api-server/src/lib/conversationState.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sandra V2: persist conversation context across workers"
          git push
