name: Sandra one-shot explicit region fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply explicit region fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch explicit region handling
        shell: python
        run: |
          from pathlib import Path
          p=Path('artifacts/api-server/src/lib/conversationState.ts')
          s=p.read_text(encoding='utf-8')
          old="""    if (!resolveRelevantRegion(state, time)) {
      state.pendingIntent = intent;
      state.waitingFor = 'location';
      state.conversationPhase = 'WAITING_FOR_LOCATION';
    } else {
"""
          new="""    // An explicit region in the current search is sufficient. It does not have
    // to be phrased as a separate current-location statement first.
    if (!region && !resolveRelevantRegion(state, time)) {
      state.pendingIntent = intent;
      state.waitingFor = 'location';
      state.conversationPhase = 'WAITING_FOR_LOCATION';
    } else {
      state.pendingIntent = undefined;
      state.waitingFor = undefined;
"""
          assert old in s, 'target block not found'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name 'Sandra-Freind'
          git config user.email 'mail@ralfpleines.de'
          git add artifacts/api-server/src/lib/conversationState.ts
          git commit -m 'Sandra V2: Apply explicit region fix'
          git push
