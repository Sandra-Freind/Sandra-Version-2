name: Sandra V2 run interpreter transcription hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply interpreter hardening
        run: python scripts/harden_interpreter_transcription.py
      - name: Commit hardened interpreter
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/api-server/src/routes/sandra.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sandra V2: retry failed speech transcription"
          git push
