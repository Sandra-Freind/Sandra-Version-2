name: Sandra V2 one-shot catalog fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct seed identity and validate all regional seeds
        shell: python
        run: |
          from pathlib import Path
          import json
          p = Path('artifacts/api-server/data/seed/central.json')
          s = p.read_text(encoding='utf-8')
          s = s.replace('dd75ee85-7094-4ef6-999b-2a5db32dd84b', 'dd75ee85-7094-4ef5-b7a6-ef49a0dad0bd')
          p.write_text(s, encoding='utf-8')

          root = Path('artifacts/api-server/data/seed')
          files = ['naklua.json','wongamat.json','central.json','pratumnak.json','jomtien.json','darkside.json']
          expected = {'naklua':15,'wongamat':1,'central':10,'pratumnak':6,'jomtien':14,'darkside':4}
          ids=[]; total=verified=pending=0
          for fn in files:
            data=json.loads((root/fn).read_text(encoding='utf-8'))
            assert data['schemaVersion']==1
            region=fn[:-5]
            assert len(data['places'])==expected[region], (region,len(data['places']))
            for place in data['places']:
              assert place['region']==region
              assert place['id'] not in ids
              ids.append(place['id'])
              assert place['name'].strip() and place['address'].strip()
              assert place['sources']
              for src in place['sources']:
                assert src['url'].startswith('https://')
              total += 1
              verified += place['status']=='verified'
              pending += place['status']=='pending'
          assert total==50 and verified==49 and pending==1 and len(set(ids))==50
          print(f'SEED_OK total={total} verified={verified} pending={pending} unique={len(set(ids))}')
      - name: Commit corrected catalog seed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/data/seed/central.json
          git commit -m "Sandra V2: correct Central catalog seed identity"
          git push
