name: Sandra V2 one-shot selection fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply latest-result selection fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch latest shown batch and selected place state
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/api-server/src/routes/sandra.ts')
          s=p.read_text(encoding='utf-8')
          old='''const rememberedPlaces = new Map<\n  string,\n  { places: VerifiedPlace[]; expiresAt: number }\n>();'''
          new='''const rememberedPlaces = new Map<\n  string,\n  {\n    places: VerifiedPlace[];\n    lastShown: VerifiedPlace[];\n    selected?: VerifiedPlace;\n    expiresAt: number;\n  }\n>();'''
          assert old in s, 'rememberedPlaces type block not found'
          s=s.replace(old,new,1)

          old='''function rememberVerifiedPlaces(session: string, places: VerifiedPlace[]): void {\n  if (places.length === 0) return;\n  const now = Date.now();\n  const existing = rememberedPlaces.get(session)?.places ?? [];\n  const merged = [...existing, ...places].reduce<VerifiedPlace[]>((all, place) => {\n    const index = all.findIndex(\n      (candidate) =>\n        candidate.title.toLocaleLowerCase("de-DE") ===\n          place.title.toLocaleLowerCase("de-DE") &&\n        candidate.address.toLocaleLowerCase("de-DE") ===\n          place.address.toLocaleLowerCase("de-DE"),\n    );\n    if (index < 0) {\n      all.push(place);\n      return all;\n    }\n    const previous = all[index];\n    all[index] = {\n      ...previous,\n      ...place,\n      catalogId: place.catalogId ?? previous?.catalogId,\n    };\n    return all;\n  }, []);\n  rememberedPlaces.set(session, {\n    places: merged.slice(-20),\n    expiresAt: now + REMEMBERED_PLACE_TTL_MS,\n  });'''
          new='''function rememberVerifiedPlaces(session: string, places: VerifiedPlace[]): void {\n  if (places.length === 0) return;\n  const now = Date.now();\n  const existing = rememberedPlaces.get(session)?.places ?? [];\n  const merged = [...existing, ...places].reduce<VerifiedPlace[]>((all, place) => {\n    const index = all.findIndex(\n      (candidate) =>\n        candidate.title.toLocaleLowerCase("de-DE") ===\n          place.title.toLocaleLowerCase("de-DE") &&\n        candidate.address.toLocaleLowerCase("de-DE") ===\n          place.address.toLocaleLowerCase("de-DE"),\n    );\n    if (index < 0) {\n      all.push(place);\n      return all;\n    }\n    const previous = all[index];\n    all[index] = {\n      ...previous,\n      ...place,\n      catalogId: place.catalogId ?? previous?.catalogId,\n    };\n    return all;\n  }, []);\n  rememberedPlaces.set(session, {\n    places: merged.slice(-20),\n    lastShown: places.slice(-3),\n    selected: undefined,\n    expiresAt: now + REMEMBERED_PLACE_TTL_MS,\n  });'''
          assert old in s, 'rememberVerifiedPlaces block not found'
          s=s.replace(old,new,1)

          old='''  const named = remembered.places.find((candidate) =>\n    normalized.includes(candidate.title.toLocaleLowerCase("de-DE")),\n  );\n  if (named) return named;\n  const ordinalMatch = intentText.match(\n    /\\b(?:der|die|das|den|dem|vom|von|nummer|nr\\.?)?\\s*(erste[nrsm]?|zweite[nrsm]?|dritte[nrsm]?|[1-3])(?:\\s+vorschlag)?\\b/u,\n  );\n  if (!ordinalMatch) return remembered.places.length === 1\n    ? remembered.places[0]\n    : undefined;\n  const ordinal = ordinalMatch[1] ?? "";\n  const index = /^(?:erst|1)/u.test(ordinal)\n    ? 0\n    : /^(?:zweit|2)/u.test(ordinal)\n      ? 1\n      : 2;\n  return remembered.places[index];'''
          new='''  const named = remembered.places.find((candidate) =>\n    normalized.includes(candidate.title.toLocaleLowerCase("de-DE")),\n  );\n  if (named) {\n    remembered.selected = named;\n    return named;\n  }\n  const ordinalMatch = intentText.match(\n    /\\b(?:der|die|das|den|dem|vom|von|nummer|nr\\.?)?\\s*(erste[nrsm]?|zweite[nrsm]?|dritte[nrsm]?|[1-3])(?:\\s+vorschlag)?\\b/u,\n  );\n  if (!ordinalMatch) {\n    if (remembered.selected) return remembered.selected;\n    if (remembered.lastShown.length === 1) {\n      remembered.selected = remembered.lastShown[0];\n      return remembered.selected;\n    }\n    return undefined;\n  }\n  const ordinal = ordinalMatch[1] ?? "";\n  const index = /^(?:erst|1)/u.test(ordinal)\n    ? 0\n    : /^(?:zweit|2)/u.test(ordinal)\n      ? 1\n      : 2;\n  const selected = remembered.lastShown[index];\n  if (selected) remembered.selected = selected;\n  return selected;'''
          assert old in s, 'selectRememberedPlace block not found'
          s=s.replace(old,new,1)

          old='''  if (/\\b(?:gefallt mir|passt|nehme ich|nehmen wir|den nehme|die nehme|das nehme)\\b/u.test(intentText)) {\n    return {\n      reply: `Okay 😊 ${place.title} passt. Wenn du noch Adresse, Telefonnummer, Öffnungszeiten oder den Google-Maps-Link brauchst, sag einfach kurz Bescheid.`,\n      maps: [place],\n    };\n  }\n\n  return null;'''
          new='''  if (/\\b(?:gefallt mir|passt|nehme ich|nehmen wir|den nehme|die nehme|das nehme)\\b/u.test(intentText)) {\n    return {\n      reply: `Okay 😊 ${place.title} passt. Wenn du noch Adresse, Telefonnummer, Öffnungszeiten oder den Google-Maps-Link brauchst, sag einfach kurz Bescheid.`,\n      maps: [place],\n    };\n  }\n\n  if (\n    /\\b(?:der|die|das|den|dem|vom|von|nummer|nr\\.?)?\\s*(?:erste[nrsm]?|zweite[nrsm]?|dritte[nrsm]?|[1-3])(?:\\s+vorschlag)?\\b/u.test(intentText)\n  ) {\n    return {\n      reply: `Okay 😊 Du meinst ${place.title}. Wenn du Adresse, Telefonnummer, Öffnungszeiten oder den Google-Maps-Link brauchst, sag einfach kurz Bescheid.`,\n      maps: [place],\n    };\n  }\n\n  return null;'''
          assert old in s, 'place selection acknowledgement block not found'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'Sandra-Freind'
          git config user.email 'mail@ralfpleines.de'
          git add artifacts/api-server/src/routes/sandra.ts
          git commit -m 'Sandra V2: Apply latest-result selection fix'
          git push
