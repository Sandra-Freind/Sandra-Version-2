name: Sandra design clear previous translation
on:
  push:
    branches: [design/sandra-pattaya-modern]
    paths:
      - .github/workflows/sandra-design-clear-previous-translation.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/sandra-pattaya-modern
      - name: Clear previous translator result when a new recording starts
        shell: python
        run: |
          from pathlib import Path
          p = Path('artifacts/mobile-app/app/(tabs)/index.tsx')
          s = p.read_text(encoding='utf-8')
          old = """          recorder.record();\n          setInterpreterTarget(target);\n"""
          new = """          recorder.record();\n          setInterpreterResult(null);\n          setInterpreterTarget(target);\n"""
          if new in s:
              print('Patch already present')
          else:
              count = s.count(old)
              assert count == 1, f'Expected exactly one target, found {count}'
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Verify behavior contract
        shell: python
        run: |
          from pathlib import Path
          s = Path('artifacts/mobile-app/app/(tabs)/index.tsx').read_text(encoding='utf-8')
          assert "recorder.record();\n          setInterpreterResult(null);\n          setInterpreterTarget(target);" in s
          print('PREVIOUS_TRANSLATION_CLEAR_OK')
      - name: Commit source change
        run: |
          if git diff --quiet; then
            echo "No source change needed"
            exit 0
          fi
          git config user.name "Sandra-Freind"
          git config user.email "mail@ralfpleines.de"
          git add 'artifacts/mobile-app/app/(tabs)/index.tsx'
          git commit -m 'Clear previous translation when new recording starts'
          git push origin HEAD:design/sandra-pattaya-modern
