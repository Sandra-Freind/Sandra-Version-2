name: Sandra V2 one-shot entertainment boundary fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Harden entertainment boundary') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch entertainment-only requests
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/api-server/src/lib/sandraKnowledge.ts')
          s=p.read_text(encoding='utf-8')
          old=r'''/\b(?:witz\w*|geschichte\w*|erzahl\w*|unterhalt\w*|langeweile|langweilig\w*|smalltalk|plauder\w*|chat\w*)\b/u.test(text)'''
          new=r'''/\b(?:witz\w*|geschichte\w*|erzahl\w*|unterhalt\w*|langeweile|langweilig\w*|smalltalk|plauder\w*|chat\w*|gedicht\w*|quiz\w*|rollenspiel\w*)\b/u.test(text) || /\bspiel mit mir\b/u.test(text)'''
          assert old in s, 'expected entertainment boundary pattern not found'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'Sandra-Freind'
          git config user.email 'mail@ralfpleines.de'
          git add artifacts/api-server/src/lib/sandraKnowledge.ts
          git commit -m 'Sandra V2: Harden entertainment boundary'
          git push
