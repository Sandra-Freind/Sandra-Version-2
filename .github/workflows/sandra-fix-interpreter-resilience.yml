name: Sandra V2 harden interpreter speech fallback
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-interpreter:
    if: ${{ !contains(github.event.head_commit.message, 'apply resilient interpreter fallback') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch interpreter fallback
        shell: python
        run: |
          from pathlib import Path
          p=Path('artifacts/api-server/src/routes/sandra.ts')
          s=p.read_text(encoding='utf-8')
          old='for (const model of ["gpt-4o-mini-transcribe", "gpt-4o-transcribe"] as const) {'
          new='for (const model of ["gpt-4o-mini-transcribe", "gpt-4o-transcribe", "whisper-1"] as const) {'
          if old in s:
              s=s.replace(old,new,1)
          anchor='    transcriptionForm.append("model", model);\n    transcriptionForm.append("language", sourceLanguage);'
          replacement='''    transcriptionForm.append("model", model);\n    transcriptionForm.append("language", sourceLanguage);\n    transcriptionForm.append(\n      "prompt",\n      sourceLanguage === "de"\n        ? "Deutsche Alltagssprache. Transkribiere exakt. Häufige Ortsnamen: Pattaya, Jomtien, Naklua, Wongamat, Pratumnak."\n        : "ภาษาไทยในชีวิตประจำวัน ถอดเสียงให้ตรงตามที่พูดมากที่สุด",\n    );'''
          if anchor in s:
              s=s.replace(anchor,replacement,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify patch
        shell: bash
        run: |
          grep -q 'whisper-1' artifacts/api-server/src/routes/sandra.ts
          grep -q 'Deutsche Alltagssprache' artifacts/api-server/src/routes/sandra.ts
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch needed'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/api-server/src/routes/sandra.ts
          git commit -m 'Sandra V2: apply resilient interpreter fallback'
          git push
